name: ig-feed

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency: ig-feed

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 피드 수집
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python ig_feed.py

      - name: 변경 시 커밋/푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed.json assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: update instagram feed"
            git push
          fi

      # jsDelivr는 @main을 최대 12시간 캐시하므로 feed.json만 즉시 갱신
      - name: jsDelivr 캐시 퍼지
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/feed.json" || true
